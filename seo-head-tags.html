<!-- 
  OMNI STORE ONLINE - SEO HEAD TAGS TEMPLATES
  Usage: Copy the relevant block into the <head> of your pages or use as a template for dynamic injection.
-->

<!-- ==========================================
     HOME PAGE
     ========================================== -->
<!-- Title & Meta -->
<title>Omni Store Online | Shop Top Electronics & Fashion in India</title>
<meta name="description" content="Shop the latest electronics, fashion, and more at Omni Store Online. Enjoy the best prices, free delivery across India, and a seamless shopping experience.">
<link rel="canonical" href="https://omnistoreonline.netlify.app/">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://omnistoreonline.netlify.app/">
<meta property="og:title" content="Omni Store Online | Shop Top Electronics & Fashion in India">
<meta property="og:description" content="Get the best deals on electronics and fashion. Free delivery across India. Shop now at Omni Store Online!">
<meta property="og:image" content="https://omnistoreonline.netlify.app/assets/og-home.jpg">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://omnistoreonline.netlify.app/">
<meta property="twitter:title" content="Omni Store Online | Shop Top Electronics & Fashion in India">
<meta property="twitter:description" content="Get the best deals on electronics and fashion. Free delivery across India. Shop now at Omni Store Online!">
<meta property="twitter:image" content="https://omnistoreonline.netlify.app/assets/og-home.jpg">

<!-- Favicons & Manifest -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Structured Data: Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Omni Store Online",
  "url": "https://omnistoreonline.netlify.app/",
  "logo": "https://omnistoreonline.netlify.app/logo.png",
  "description": "Omni Store Online is a premier e-commerce platform in India offering a wide range of products including electronics, fashion, and home essentials.",
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+91-XXXXXXXXXX",
    "contactType": "customer service",
    "areaServed": "IN",
    "availableLanguage": ["en", "hi"]
  },
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "IN"
  },
  "sameAs": [
    "https://facebook.com/omnistoreonline",
    "https://instagram.com/omnistoreonline",
    "https://twitter.com/omnistoreonline"
  ]
}
</script>

<!-- Structured Data: WebSite (Sitelinks Searchbox) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "url": "https://omnistoreonline.netlify.app/",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://omnistoreonline.netlify.app/shop?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>


<!-- ==========================================
     PRODUCT LISTING PAGE (/shop or /products)
     ========================================== -->
<!-- Title & Meta -->
<title>Shop [Category Name] Online | Omni Store Online India</title>
<meta name="description" content="Explore our wide range of [Category Name]. Best quality, competitive prices, and free delivery on all orders in India.">

<!-- Structured Data: ItemList (Product Collections) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "url": "https://omnistoreonline.netlify.app/product/1"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "url": "https://omnistoreonline.netlify.app/product/2"
    }
  ]
}
</script>


<!-- ==========================================
     PRODUCT DETAIL PAGE (/product/:id)
     ========================================== -->
<!-- Title & Meta -->
<title>[Product Name] | Omni Store Online</title>
<meta name="description" content="Buy [Product Name] at Omni Store Online. Check price, features, and reviews. Free delivery and secure payment available.">

<!-- Structured Data: Product -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "[Product Name]",
  "image": [
    "https://omnistoreonline.netlify.app/assets/products/image1.jpg"
  ],
  "description": "[Product Description]",
  "sku": "[SKU-ID]",
  "brand": {
    "@type": "Brand",
    "name": "[Brand Name]"
  },
  "offers": {
    "@type": "Offer",
    "url": "https://omnistoreonline.netlify.app/product/[id]",
    "priceCurrency": "INR",
    "price": "[Price]",
    "itemCondition": "https://schema.org/NewCondition",
    "availability": "https://schema.org/InStock"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.5",
    "reviewCount": "24"
  }
}
</script>


<!-- ==========================================
     CATEGORY PAGES (Breadcrumbs)
     ========================================== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [{
    "@type": "ListItem",
    "position": 1,
    "name": "Home",
    "item": "https://omnistoreonline.netlify.app/"
  },{
    "@type": "ListItem",
    "position": 2,
    "name": "[Category Name]",
    "item": "https://omnistoreonline.netlify.app/shop/[category]"
  }]
}
</script>
